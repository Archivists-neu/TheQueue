# ------------------------------------------------------------
# Streamlit configuration for this app.
#
# Theme and client settings below are picked up as soon as you save this
# file — no container restart needed. Refresh the browser tab if a change
# doesn't appear. If it still doesn't, restart: docker compose restart app
#
# Full list of options:
# https://docs.streamlit.io/develop/api-reference/configuration/config.toml
#
# See docs/Theming.md for a guide to changing the look of your app.
# ------------------------------------------------------------

[client]
# Turn off Streamlit's built-in page navigation so that nav.py can build
# the sidebar itself, one link at a time, based on the user's role.
showSidebarNavigation = false

# Hide the "Deploy" button and trim the top-right menu down to the useful
# developer entries (Rerun, Settings). Use "viewer" to hide the menu
# entirely, or "developer" to get everything back.
toolbarMode = "minimal"

[server]
# Re-run the app automatically when a source file is saved.
runOnSave = true

# ------------------------------------------------------------
# Theme — the main content area.
# Colors are hex strings. Fonts are "sans-serif", "serif", or "monospace".
# ------------------------------------------------------------
[theme]

base = "light"

primaryColor = "#1E2F43"
backgroundColor = "#F8F3EF"
secondaryBackgroundColor = "#EDE7E2"
textColor = "#1E2F43"
linkColor = "#BD8873"

font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"

# -----------------------------
# Typography
# -----------------------------

# Makes headings feel more like the typography in the logo.
baseFontSize = 16

# -----------------------------
# Shape
# -----------------------------

# A little rounding makes cards/inputs feel polished without
# giving everything the bubbly default-app look.
baseRadius = "0.5rem"
buttonRadius = "full"

# -----------------------------
# Borders
# -----------------------------

borderColor = "#C5BBB4"
showWidgetBorder = true

# -----------------------------
# Data / charts
# -----------------------------

# Pull chart colors directly from the logo palette.
chartCategoricalColors = [
    "#1E2F43",
    "#BD8873",
    "#A77A63",
    "#7C8977",
    "#697984",
    "#D7B6A5"
]

# Nice navy progression for continuous data.
chartSequentialColors = [
    "#E8E4DF",
    "#C8CDD0",
    "#9DA8AE",
    "#697984",
    "#405469",
    "#1E2F43"
]


[theme.sidebar]

backgroundColor = "#1E2F43"
secondaryBackgroundColor = "#2D4054"
textColor = "#F8F3EF"
primaryColor = "#BD8873"
borderColor = "#475365"

# Keep the sidebar typography consistent with the main app.
font = "sans-serif"
headingFont = "serif"